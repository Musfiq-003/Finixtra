name: finixtra_mobile
description: FINIXTRA Offline-First FinTech App (GetConnect Mesh Integration)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  provider: ^6.0.5
  get_it: ^7.6.0
  
  # Networking & Mesh
  flutter_blue_plus: ^1.11.0 # BLE for Discovery
  flutter_p2p_connection: ^3.0.3 # Wi-Fi Direct for Data Transfer
  http: ^1.1.0               # API Gateway Sync
  connectivity_plus: ^5.0.0  # Internet connection detection
  
  # Storage (Store-and-Forward)
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.1
  
  # Security
  encrypt: ^5.0.1
  crypto: ^3.0.3
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
